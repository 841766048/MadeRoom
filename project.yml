name: MadeRoom
options:
  bundleIdPrefix: studio.maderoom
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  MadeRoom:
    type: application
    platform: iOS
    sources:
      - path: MadeRoom
        excludes: [Resources]
      - path: MadeRoom/Resources/BrandAssets.xcassets
      - path: MadeRoom/Resources/TabIcons.xcassets
      - path: MadeRoom/Resources/AuthFonts
        type: folder
        buildPhase: resources
      - path: MadeRoom/Resources/EditorialAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: studio.maderoom.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Made Room
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  MadeRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MadeRoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MadeRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MadeRoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MadeRoom:
    build:
      targets:
        MadeRoom: all
    test:
      targets: [MadeRoomTests, MadeRoomUITests]
