<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Made Room · 原生账号流程</title><style>body{margin:0;padding:40px;background:#eeece5;color:#172b28;font-family:system-ui,sans-serif}h1{font-size:26px}p{color:#69776f;line-height:1.6}.screens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}figure{margin:0}img{width:100%;border-radius:24px}figcaption{margin:14px 0;font-size:15px}@media(max-width:850px){.screens{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){body{padding:20px}.screens{grid-template-columns:1fr}}</style><h1>Made Room · 原生账号流程</h1><p>依据 Pixso MCP 获取的设计实现。以下为 iPhone 17 Pro 模拟器英文界面实际截图。<br>已修正文字行高与上下留白，注册协议改为空心方框／绿色勾选及浅绿选中背景。<br>此前 26 项单元测试与 3 项账号流程 UI 测试通过；账号服务已接入 Firebase Spark；自动强密码填充仍需真机验证。</p><main class="screens"><figure><img src="login-en.png?v=20261008-layout2" alt="原生登录页"><figcaption>01 邮箱登录 · 插画上下渐变</figcaption></figure><figure><img src="register-en.png?v=20261008-layout2" alt="原生注册页"><figcaption>02 创建账号 · 输入与协议校验</figcaption></figure><figure><img src="reset-en.png?v=20261008-layout2" alt="原生找回密码页"><figcaption>03 找回密码 · 邮箱校验</figcaption></figure><figure><img src="privacy-en.png?v=20261008-layout2" alt="原生首次启动协议页"><figcaption>04 首次启动 · 明确同意后保存</figcaption></figure></main></html>
